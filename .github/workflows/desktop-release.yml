name: desktop-release

# Build, sign, and release the desktop (Tauri) app.
# Triggered by desktop-version tags ONLY (desktop-v1.2.3) so this flow is fully
# independent of the extension's `v*` tags handled by .github/workflows/build.yml.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

# Avoid two release runs for the same tag racing each other.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Create the draft GitHub Release ONCE, up front. The per-OS build jobs then
  # upload into THIS release (by id) instead of each running tauri-action with a
  # tagName and racing to "create the release if it's missing". That race is what
  # produced two release rows for one tag (macOS assets in one, Linux/Windows in
  # the other, each with its own half-populated latest.json). Find-or-create keeps
  # it idempotent so a re-run reuses the existing release rather than duplicating.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Create (or reuse) the draft release
        id: create-release
        uses: actions/github-script@v7
        env:
          TAG: ${{ github.ref_name }}
        with:
          result-encoding: string
          script: |
            const tag = process.env.TAG;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // Reuse an existing release for this tag if one is already present
            // (e.g. a re-run), otherwise create a fresh draft.
            let release = null;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `shot2issue Desktop ${tag}`,
                body: [
                  'See the assets attached below for installers.',
                  '',
                  '- `.dmg` — macOS (universal: Apple Silicon + Intel, self-signed; right-click → Open on first launch)',
                  '- `.AppImage` / `.deb` — Linux (x86_64)',
                  '- `.exe` (NSIS) / `.msi` — Windows (x86_64)',
                ].join('\n'),
                draft: true,
                prerelease: false,
              })).data;
            }
            return String(release.id);

  build:
    needs: create-release
    permissions:
      contents: write # upload assets to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # The full system-lib set the Tauri 2 + xcap 0.9.6 stack needs on Linux.
      # This mirrors apps/desktop/scripts/check.sh (verified to compile the crate):
      # xcap 0.9.6 pulls pipewire + needs libclang (bindgen); global-shortcut/xcap
      # on X11 need xdo + xcb.
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev libssl-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxrandr-dev \
            libxdo-dev libdbus-1-dev libpipewire-0.3-dev clang libclang-dev \
            libgbm-dev libegl-dev libdrm-dev libwayland-dev libxkbcommon-dev \
            patchelf

      # ---- macOS self-signed code signing -------------------------------
      # Import a self-signed cert (.p12) into a throwaway keychain so the .app
      # carries a STABLE code-signing identity. macOS anchors the Screen
      # Recording (TCC) grant to the signature; a stable identity keeps the
      # grant across auto-updates. We do NOT notarize. tauri-action picks up
      # APPLE_SIGNING_IDENTITY automatically and signs during bundling.
      # The whole block no-ops when APPLE_CERTIFICATE is not set (forks/PRs).
      - name: Import macOS signing certificate
        id: macos_cert
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Put our keychain first in the search list so codesign finds it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "signing_identity=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Imported identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Root workspaces install: builds the node_modules/@shot2issue/core symlink
      # the desktop app imports, and hoists its deps. (No `npm ci` because the
      # root lockfile is intentionally not committed — apps/extension keeps its
      # own lock for the Docker build; see .gitignore.)
      - name: Install workspace deps
        run: npm install

      # ---- Build + sign + upload to the pre-created release ------------
      # releaseId targets the single draft from create-release, so tauri-action
      # only UPLOADS here (it never creates a release). Every OS job uploads its
      # installers AND updater signatures (.sig) to the one release.
      #
      # includeUpdaterJson: false is the key to running the matrix in PARALLEL:
      # tauri-action's latest.json writer is a read-merge-delete-reupload on a
      # single shared asset, so concurrent jobs would clobber each other (drop a
      # platform) or 422 on a duplicate create. We skip it here and let the
      # update-latest-json job below assemble the complete manifest ONCE, after
      # all builds finish, from the uploaded .sig files.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # minisign updater signing (required — same as curvault):
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing (self-signed, no notarization). Empty on other
          # platforms / when the secret is absent — tauri then skips signing.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # With a real cert this is its CN; without one, '-' = ad-hoc signing so
          # the universal .app still gets codesigned (an empty identity fails).
          APPLE_SIGNING_IDENTITY: ${{ steps.macos_cert.outputs.signing_identity || '-' }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Do NOT write latest.json per-job (assembled once, below). Still upload
          # the .sig files — that's what the assembly step reads.
          includeUpdaterJson: false
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}

      # ---- Windows OS signing placeholder ------------------------------
      # No-op unless WINDOWS_CERTIFICATE is provided. When present, sign the
      # produced installers with signtool. (Authenticode is independent of the
      # minisign updater signature, which is already applied above.) For
      # production prefer Tauri's windows.signCommand so signing runs BEFORE
      # latest.json hashing; this post-build step only documents the hook.
      - name: Sign Windows installers (placeholder)
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\win-cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $bundle = "apps/desktop/src-tauri/target/release/bundle"
          Get-ChildItem -Path $bundle -Recurse -Include *.exe,*.msi | ForEach-Object {
            signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $_.FullName
          }

      # ---- Linux OS signing placeholder --------------------------------
      # No-op unless LINUX_GPG_PRIVATE_KEY is provided. AppImage/deb signing is
      # optional; the minisign updater signature already covers update trust.
      - name: Sign Linux packages (placeholder)
        if: matrix.platform == 'ubuntu-24.04' && env.LINUX_GPG_PRIVATE_KEY != ''
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          echo "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          BUNDLE=apps/desktop/src-tauri/target/release/bundle
          find "$BUNDLE" \( -name '*.AppImage' -o -name '*.deb' \) | while read -r f; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$LINUX_GPG_PASSPHRASE" \
              --detach-sign --armor "$f"
          done

  # Assemble the updater manifest ONCE, after every OS build has finished and
  # uploaded its installers + .sig files to the shared release. `needs: build`
  # blocks on the whole matrix, and because `needs` requires success, a failed
  # OS build skips this job — we never publish a manifest that's missing a
  # platform. The manifest is built from the .sig assets on the release itself,
  # so it doesn't depend on cross-job file passing.
  update-latest-json:
    needs: [create-release, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Assemble and upload latest.json
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const tag = process.env.TAG;
            const version = tag.replace(/^desktop-v/, '');

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: releaseId, per_page: 100,
            });

            // Updater platform key -> the artifact suffix it points at (its
            // signature lives at "<artifact name>.sig"). These keys mirror what
            // tauri-action itself emits for a universal-macOS + Linux
            // (AppImage/deb/rpm) + Windows (msi/nsis) bundle.
            const MAP = {
              'linux-x86_64': '.AppImage',
              'linux-x86_64-appimage': '.AppImage',
              'linux-x86_64-deb': '.deb',
              'linux-x86_64-rpm': '.rpm',
              'windows-x86_64': '.msi',
              'windows-x86_64-msi': '.msi',
              'windows-x86_64-nsis': '-setup.exe',
              'darwin-aarch64': '.app.tar.gz',
              'darwin-x86_64': '.app.tar.gz',
              'darwin-aarch64-app': '.app.tar.gz',
              'darwin-x86_64-app': '.app.tar.gz',
            };
            // One artifact per OS MUST be present, else a build silently dropped
            // out — refuse to write a half manifest.
            const REQUIRED = ['.app.tar.gz', '.AppImage', '.msi', '-setup.exe'];

            const artFor = (suffix) =>
              assets.find((a) => a.name.endsWith(suffix) && !a.name.endsWith('.sig'));
            const sigAssetFor = (name) => assets.find((a) => a.name === `${name}.sig`);

            for (const suffix of REQUIRED) {
              const art = artFor(suffix);
              if (!art) throw new Error(`Missing updater artifact "*${suffix}" — build incomplete, refusing to write latest.json`);
              if (!sigAssetFor(art.name)) throw new Error(`Missing signature "${art.name}.sig" — refusing to write latest.json`);
            }

            // signature field = base64 of the .sig file's bytes (matches tauri).
            const sigCache = new Map();
            async function signatureFor(name) {
              if (!sigCache.has(name)) {
                const sig = sigAssetFor(name);
                const res = await github.rest.repos.getReleaseAsset({
                  owner, repo, asset_id: sig.id, headers: { accept: 'application/octet-stream' },
                });
                sigCache.set(name, Buffer.from(res.data).toString('base64'));
              }
              return sigCache.get(name);
            }

            const platforms = {};
            for (const [key, suffix] of Object.entries(MAP)) {
              const art = artFor(suffix);
              if (!art) { core.warning(`No artifact for ${key} (${suffix}); skipping`); continue; }
              platforms[key] = {
                signature: await signatureFor(art.name),
                // Construct the stable public URL tauri expects (works once the
                // release is published), rather than the draft browser_download_url.
                url: `https://github.com/${owner}/${repo}/releases/download/${tag}/${art.name}`,
              };
            }

            const notes = [
              'See the assets attached below for installers.',
              '',
              '- `.dmg` — macOS (universal: Apple Silicon + Intel, self-signed; right-click → Open on first launch)',
              '- `.AppImage` / `.deb` — Linux (x86_64)',
              '- `.exe` (NSIS) / `.msi` — Windows (x86_64)',
            ].join('\n');
            const latest = { version, notes, pub_date: new Date().toISOString(), platforms };

            // Replace any latest.json a build may have left behind.
            for (const a of assets.filter((a) => a.name === 'latest.json')) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: releaseId, name: 'latest.json',
              data: JSON.stringify(latest, null, 2),
              headers: { 'content-type': 'application/json' },
            });
            core.info(`latest.json assembled with platforms: ${Object.keys(platforms).join(', ')}`);
