name: build

# Build the extension package with Docker on pushes to main, pull requests, version
# tags, and manual runs.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # required to create a Release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build with Docker and export the artifact (zip) to ./dist.
      # --target export selects the scratch stage; --output writes it to the host.
      - name: Build extension package (Docker)
        run: docker build --target export --output type=local,dest=dist .

      - name: List artifacts
        run: ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shot2issue-extension
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
