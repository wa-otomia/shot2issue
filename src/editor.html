<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>shot2issue</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <header>
    <h1><span class="dot"></span> shot2issue <span class="hint" id="subtitle" data-i18n="editorSubtitle" style="font-weight:400;color:var(--muted);font-size:13px;"></span></h1>
    <span class="spacer"></span>
    <span id="loginState" class="hint" style="font-size:12px;color:var(--muted);"></span>
    <a id="openOptions" class="hint" data-i18n="settings" style="font-size:12px;color:var(--accent);cursor:pointer;margin-left:12px;"></a>
  </header>

  <div class="layout">
    <!-- Left: screenshot + annotation tools -->
    <div class="canvas-col">
      <div class="toolbar" id="toolbar">
        <div class="tool-group">
          <button class="tool active" data-tool="rect" data-i18n-title="toolRectTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg></button>
          <button class="tool" data-tool="numrect" data-i18n-title="toolNumRectTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="9" width="14" height="10" rx="1.5"/><circle cx="7" cy="7" r="3.4" fill="currentColor" stroke="none"/></svg></button>
          <button class="tool" data-tool="arrow" data-i18n-title="toolArrowTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="18" y2="6"/><polyline points="10 6 18 6 18 14"/></svg></button>
          <button class="tool" data-tool="pen" data-i18n-title="toolPenTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19l1.6 -4.6 9 -9 3 3 -9 9z"/><path d="M14 7.5l3 3"/></svg></button>
          <button class="tool" data-tool="text" data-i18n-title="toolTextTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14"/><path d="M12 6v13"/></svg></button>
          <button class="tool" data-tool="mosaic" data-i18n-title="toolMosaicTitle"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="4" y="4" width="5" height="5" rx="0.5"/><rect x="14" y="4" width="5" height="5" rx="0.5"/><rect x="9" y="9.5" width="5" height="5" rx="0.5"/><rect x="4" y="15" width="5" height="5" rx="0.5"/><rect x="14" y="15" width="5" height="5" rx="0.5"/></svg></button>
          <button class="tool" data-tool="crop" data-i18n-title="toolCropTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v13a1 1 0 0 0 1 1h13"/><path d="M3 7h13a1 1 0 0 1 1 1v13"/></svg></button>
        </div>
        <span class="sep"></span>
        <div class="ctl-group">
          <label class="swatch" data-i18n-title="color"><input type="color" id="color" value="#ff3b30" /><span data-i18n="color"></span></label>
          <label class="swatch" data-i18n-title="strokeColorTitle"><input type="color" id="strokeColor" value="#ffffff" /><span data-i18n="strokeColor"></span></label>
          <label class="slider" id="strokeWidthCtl" data-i18n-title="strokeWidth"><span data-i18n="strokeWidth"></span><input type="range" id="strokeWidth" min="0" max="12" value="3" /></label>
          <label class="slider" id="widthCtl"><span data-i18n="thickness"></span><input type="range" id="width" min="2" max="14" value="4" /></label>
          <label class="slider hidden" id="fontSizeCtl"><span data-i18n="fontSize"></span><input type="range" id="fontSize" min="12" max="96" value="28" /></label>
        </div>
        <span class="sep"></span>
        <div class="tool-group">
          <button id="undo" class="act" data-i18n-title="undoTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l-5 5 5 5"/><path d="M4 10h9a5 5 0 0 1 0 10h-2"/></svg></button>
          <button id="clear" class="act" data-i18n-title="clearTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1 -13"/></svg></button>
          <button id="download" class="act" data-i18n-title="downloadPngTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg></button>
          <button id="copy" class="act" data-i18n-title="copyPngTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/></svg></button>
          <button id="paste" class="act" data-i18n-title="pasteImageTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="12" height="16" rx="1.5"/><path d="M9 5V3.5h6V5"/></svg></button>
        </div>
      </div>

      <div class="thumb-strip hidden" id="thumbStrip"></div>

      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas"></canvas>
        <textarea id="textInput" wrap="off" rows="1" spellcheck="false"></textarea>
        <div class="canvas-empty hidden" id="canvasEmpty" data-i18n="canvasEmpty"></div>
        <!-- Crop confirm buttons float next to the crop box (positioned in editor.ts) -->
        <div class="crop-actions hidden" id="cropBar">
          <button id="cropApply" class="primary" data-i18n="cropApply" data-i18n-title="cropApplyTitle"></button>
          <button id="cropCancel" class="ghost" data-i18n="cropCancel" data-i18n-title="cropCancelTitle"></button>
        </div>
      </div>
    </div>

    <!-- Right: description + submit -->
    <div class="form-col" id="formCol">
      <label for="workspace" data-i18n="fieldWorkspace"></label>
      <select id="workspace"></select>

      <label for="type" data-i18n="fieldType"></label>
      <select id="type"></select>

      <label for="title" data-i18n="fieldTitle"></label>
      <input type="text" id="title" data-i18n-placeholder="titlePlaceholder" />

      <label for="body"><span data-i18n="fieldBody"></span> <span class="hint" data-i18n="bodyHint"></span></label>
      <textarea id="body" data-i18n-placeholder="bodyPlaceholder"></textarea>

      <!-- AI assistant, just above the submit buttons -->
      <div class="ai-actions-head" data-i18n="aiActionsHeading"></div>
      <div class="ai-actions" id="aiActions">
        <div class="ai-row">
          <select id="aiModel" class="hidden" data-i18n-title="aiModel"></select>
          <select id="aiReasoning" class="hidden" data-i18n-title="aiReasoningLabel">
            <option value="off" data-i18n="aiReasoningOff"></option>
            <option value="low" data-i18n="aiReasoningLow"></option>
            <option value="medium" data-i18n="aiReasoningMedium"></option>
            <option value="high" data-i18n="aiReasoningHigh"></option>
          </select>
        </div>
        <div class="ai-row">
          <button id="aiTitle" class="ghost" data-i18n="aiTitle" data-i18n-title="aiTitleTitle"></button>
          <button id="complaint" class="primary" data-i18n="complaint" data-i18n-title="complaintTitle"></button>
          <label class="auto-dictate"><input type="checkbox" id="autoDictate" /> <span data-i18n="autoDictate"></span></label>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="submit" data-i18n="submit"></button>
        <button class="ghost" id="submitNoImage" data-i18n="submitNoImage" data-i18n-title="submitNoImageTitle"></button>
      </div>

      <div id="status" class="info"></div>
      <div id="result"></div>
    </div>
  </div>

  <!-- Complaint modal: type or dictate a complaint, then generate the title + body -->
  <div class="modal-overlay hidden" id="complaintModal">
    <div class="modal">
      <div class="modal-head">
        <span data-i18n="complaintModalTitle"></span>
        <button class="modal-close" id="complaintClose" title="Esc">✕</button>
      </div>
      <textarea id="complaintText" data-i18n-placeholder="complaintPlaceholder"></textarea>
      <div class="modal-actions">
        <button id="complaintRecord" class="ghost" data-i18n="complaintRecordStart"></button>
        <button id="complaintClear" class="ghost" data-i18n="complaintClear"></button>
        <span class="spacer"></span>
        <button id="complaintGenerate" class="primary" data-i18n="complaintGenerate"></button>
      </div>
      <div id="complaintStatus" class="info"></div>
    </div>
  </div>

  <!-- Floating AI status bubble; points at the active button (positioned in editor.ts) -->
  <div class="ai-bubble hidden" id="aiBubble">
    <div class="ai-bubble-head">
      <span class="ai-bubble-dot"></span>
      <span class="ai-bubble-status" id="aiBubbleStatus"></span>
      <span class="ai-bubble-check" id="aiBubbleCheck">✓</span>
    </div>
    <div class="ai-bubble-think" id="aiBubbleThink"></div>
  </div>

  <script type="module" src="editor.js"></script>
</body>
</html>
